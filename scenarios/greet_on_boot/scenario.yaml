id: greet_on_boot
version: "0.1.0"
title: Greet on boot
description: First boot greeting and environment check scenario.
type: one_shot
vars:
  outputs_preferred: ["telegram", "voice"]
  input_preferred: "voice"
trigger: boot
data_projections:
  - scope: subnet
    slot: infra.status
    targets:
      - backend: yjs
        path: data/infra/status

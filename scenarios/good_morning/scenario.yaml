# yaml-language-server: $schema=../../../../src/adaos/abi/scenario.schema.json
id: good_morning
version: "0.1.0"
title: Good Morning
description: Morning greeting with a weather brief routed through voice/telegram/stdout plus a console print.
type: one_shot
vars:
  outputs_preferred: ["console", "voice", "telegram"]
  input_preferred: "voice"
trigger: boot
data_projections:
  - scope: subnet
    slot: weather.snapshot
    targets:
      - backend: yjs
        path: data/weather

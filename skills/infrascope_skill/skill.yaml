name: infrascope_skill
version: 0.5.0
entry: handlers/main.py
runtime:
  python: '3.11'
description: UI-facing projection skill for the Infrascope operator scenario.
dependencies: []
events:
  subscribe:
  - infrascope.refresh
  - operations.
  - device.registered
  - webrtc.peer.state.changed
  - skill.installed
  - skill.uninstalled
  - scenario.installed
  - scenario.removed
  - scenarios.synced
  - skills.activated
  - skills.updated
  - skills.rolledback
  - skill.service.ready
  - desktop.webspace.refresh
  - desktop.webspace.reload
  - desktop.webspace.reloaded
  - desktop.webspace.reset
  - desktop.webspace.restored
  - desktop.webspace.go_home
  - desktop.webspace.set_home
  - desktop.webspace.set_home_current
  - desktop.webspace.create
  - desktop.webspace.rename
  - desktop.webspace.update
  - desktop.webspace.delete
  - desktop.scenario.set
  - node.yjs.control.completed
  - node.yjs.control.failed
  - sys.ready
  - subnet.nats.up
  - subnet.nats.down
  - subnet.nats.reconnect
  - subnet.member.link.up
  - subnet.member.link.down
  - subnet.member.meta.changed
  - subnet.member.snapshot.changed
  - subnet.member.snapshot.requested
  - subnet.member.update.requested
  - subnet.member.update.result
  - subnet.stopping
  - subnet.stopped
  - core.update.status
  - hub.core_update.status
  - node.names.changed
data_projections:
- scope: subnet
  slot: infrascope.snapshot
  targets:
  - backend: yjs
    path: data/infrascope
tools:
- name: get_overview_summary
  description: Return the summary tile payload for the Infrascope overview.
  entry: handlers.main:get_overview_summary
  input_schema:
    type: object
    properties:
      webspace_id:
        type:
        - string
        - 'null'
  output_schema:
    type: object
- name: list_overview_collection
  description: Return one overview collection for the Infrascope workspace.
  entry: handlers.main:list_overview_collection
  input_schema:
    type: object
    required:
    - section
    properties:
      section:
        type: string
        enum:
        - health_strip
        - active_incidents
        - quota_summary
        - active_runtimes
        - recent_changes
      webspace_id:
        type:
        - string
        - 'null'
  output_schema:
    type: array
    items:
      type: object
- name: list_inventory
  description: Return inventory rows for one Infrascope object class.
  entry: handlers.main:list_inventory
  input_schema:
    type: object
    properties:
      kind:
        type: string
        enum:
        - all
        - hubs
        - members
        - browsers
        - devices
        - skills
        - scenarios
        - runtimes
        - quotas
      webspace_id:
        type:
        - string
        - 'null'
  output_schema:
    type: array
    items:
      type: object
- name: get_object_inspector
  description: Return the unified object-inspector payload for a selected object.
  entry: handlers.main:get_object_inspector
  input_schema:
    type: object
    properties:
      object_id:
        type:
        - string
        - 'null'
      task_goal:
        type:
        - string
        - 'null'
      webspace_id:
        type:
        - string
        - 'null'
  output_schema:
    type: object
- name: get_snapshot
  description: Return the current Infrascope YJS snapshot payload.
  entry: handlers.main:get_snapshot
  input_schema:
    type: object
    properties:
      webspace_id:
        type:
        - string
        - 'null'
      task_goal:
        type:
        - string
        - 'null'
  output_schema:
    type: object
- name: refresh_snapshot
  description: Rebuild and project the current Infrascope snapshot into YJS.
  entry: handlers.main:refresh_snapshot
  input_schema:
    type: object
    properties:
      webspace_id:
        type:
        - string
        - 'null'
      task_goal:
        type:
        - string
        - 'null'
  output_schema:
    type: object
exports: {}
prototype: default
updated_at: '2026-04-08T07:28:57+00:00'


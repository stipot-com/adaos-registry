# yaml-language-server: $schema=../../../src/adaos/abi/skill.schema.json
name: voice_chat_skill
version: '0.0.1'
description: Voice chat bridge for web_desktop (browser STT + per-webspace chat + browser TTS).
runtime:
  python: '3.11'
events:
  subscribe: []
  publish:
    - 'io.out.chat.append'
    - 'io.out.say'
tools:
  - name: 'handle_text'
    description: Convert text into a weather request and publish chat + tts outputs (no direct Yjs writes).
    entry: 'handlers.main:handle_text'
    input_schema:
      type: object
      properties:
        text: { type: string, minLength: 1 }
        _meta: { type: object }

name: browsers_skill
version: 0.15.3
entry: handlers/main.py
runtime:
  python: '3.11'
description: ''
dependencies: []
events:
  subscribe:
  - sys.ready
  - skills.activated
  - desktop.webspace.refresh
  - desktop.webspace.reload
  - desktop.webspace.reloaded
  - browser.session.changed
  - device.registered
  - subnet.member.link.up
  - subnet.member.link.down
  - webio.stream.snapshot.requested
  - webio.stream.subscription.changed
data_projections:
- scope: subnet
  slot: browsers.summary
  targets:
  - backend: yjs
    path: data/browsers/summary
data_routes:
- surface: modal:browsers_summary
  route: yjs
  owner: skill:browsers_skill
  projection_slot: browsers.summary
  path: data/browsers/summary
  first_paint: compact browser counts from the last Yjs snapshot
  recovery: Yjs replay restores the compact count; refresh rebuilds it.
  update_source:
  - browser.session.changed
  - device.registered
  - desktop.webspace.refresh
  budget:
    max_payload_bytes: 2048
    max_publish_hz: 0.5
    coalesce_ms: 1000
    snapshot_policy: none
  guard_visibility:
    degraded_state: Summary keeps the last compact count and points to stream details.
    log: service.browsers_skill.runtime.log
    quarantine: true
    metric: yjs_owner_guard.browsers.summary
- surface: modal:browsers_devices
  route: stream
  owner: skill:browsers_skill
  receiver: browsers.devices
  first_paint: empty devices list until snapshot-on-subscribe publishes rows
  recovery: Stream snapshot request republishes current browser devices.
  update_source:
  - webio.stream.snapshot.requested
  - browser.session.changed
  - device.registered
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 1
    max_items: 256
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: Keep last browser devices rows and surface stream guard pressure.
    log: service.browsers_skill.runtime.log
    quarantine: false
    metric: webio_stream_guard.browsers.devices
- surface: modal:browsers_clients
  route: stream
  owner: skill:browsers_skill
  receiver: browsers.clients
  first_paint: empty clients list until snapshot-on-subscribe publishes rows
  recovery: Stream snapshot request republishes current temporary clients.
  update_source:
  - webio.stream.snapshot.requested
  - browser.session.changed
  - device.registered
  budget:
    max_payload_bytes: 65536
    max_publish_hz: 1
    max_items: 256
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: Keep last browser client rows and surface stream guard pressure.
    log: service.browsers_skill.runtime.log
    quarantine: false
    metric: webio_stream_guard.browsers.clients
- surface: modal:browser_current
  route: stream
  owner: skill:browsers_skill
  receiver: browsers.current_summary
  first_paint: empty selected-browser summary until subscribe snapshot
  recovery: Stream snapshot request republishes selected browser summary.
  update_source:
  - webio.stream.snapshot.requested
  - browsers_skill.select_browser
  budget:
    max_payload_bytes: 8192
    max_publish_hz: 1
    max_items: 16
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: Keep last selected-browser summary rows.
    log: service.browsers_skill.runtime.log
    quarantine: false
    metric: webio_stream_guard.browsers.current_summary
- surface: modal:browser_current_name
  route: stream
  owner: skill:browsers_skill
  receiver: browsers.current_name
  first_paint: empty selected-browser name until subscribe snapshot
  recovery: Stream snapshot request republishes selected browser name.
  update_source:
  - webio.stream.snapshot.requested
  - browsers_skill.select_browser
  budget:
    max_payload_bytes: 2048
    max_publish_hz: 1
    max_items: 1
    snapshot_policy: on_subscribe
  guard_visibility:
    degraded_state: Keep last selected-browser name value.
    log: service.browsers_skill.runtime.log
    quarantine: false
    metric: webio_stream_guard.browsers.current_name
tools: []
exports: {}
updated_at: '2026-05-20T12:35:28+00:00'


name: rasa_nlu_service_skill
version: 0.2.0
description: Local Rasa NLU-only service for AdaOS intent detection
runtime:
  kind: service
  env:
    mode: venv
    python: '3.11'
service:
  host: 127.0.0.1
  port: 18092
  command:
  - -m
  - handlers.main
  healthcheck:
    path: /health
    timeout_ms: 1000
permissions:
- network
events:
  subscribe:
  - nlp.intent.detect.rasa
  - nlp.rasa.train
  publish:
  - nlp.intent.detected
dependencies:
- --no-deps
- -e
- file:///D:/git/adaos/src/adaos/integrations/rasa-port
updated_at: '2026-05-11T16:47:42+00:00'


# yaml-language-server: $schema=../../../../src/adaos/abi/skill.schema.json
name: infrastate_skill
version: '0.1.0'
description: Локальный обзор состояния ядра, graceful update, A/B слотов и последнего результата обновления.
runtime:
  python: '3.11'
dependencies: []
events:
  subscribe:
    - 'infrastate.refresh'
    - 'skills.activated'
    - 'desktop.webspace.reload'
    - 'subnet.nats.up'
    - 'subnet.stopping'
    - 'subnet.stopped'
data_projections:
  - scope: subnet
    slot: infrastate.snapshot
    targets:
      - backend: yjs
        path: data/infrastate
default_tool: 'get_snapshot'
tools:
  - name: 'get_snapshot'
    description: Return current local infrastructure/update snapshot for the node.
    entry: 'handlers.main:get_snapshot'
    input_schema:
      type: object
      properties:
        webspace_id: { type: string }
    output_schema:
      type: object
      required: [summary, slots, steps, logs]
  - name: 'refresh_snapshot'
    description: Refresh infrastructure snapshot and project it into the active webspace.
    entry: 'handlers.main:refresh_snapshot'
    input_schema:
      type: object
      properties:
        webspace_id: { type: string }
    output_schema:
      type: object
      required: [ok, summary]

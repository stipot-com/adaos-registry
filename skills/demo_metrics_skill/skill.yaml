name: demo_metrics_skill
version: 0.11.0
description: Neutral demo skill for semantic Web UI migration with a metrics table,
  chart payload, and live event stream.
runtime:
  python: '3.11'
webui_owner: shared
data_projections:
- scope: webspace
  slot: demo.metrics.summary
  targets:
  - backend: yjs
    path: data/demo_metrics/summary
- scope: webspace
  slot: demo.metrics.table
  targets:
  - backend: yjs
    path: data/demo_metrics/table
- scope: webspace
  slot: demo.metrics.chart
  targets:
  - backend: yjs
    path: data/demo_metrics/chart
- scope: webspace
  slot: demo.metrics.selection
  targets:
  - backend: yjs
    path: data/demo_metrics/selection
events:
  subscribe:
  - webio.stream.snapshot.requested
  - webio.stream.subscription.changed
  - demo_metrics.host_action
tools:
- name: get_demo_snapshot
  description: Return the static demo metrics snapshot used by the browser demo surfaces.
  entry: handlers.main:get_demo_snapshot
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      snapshot:
        type: object
    required:
    - ok
    - snapshot
- name: list_demo_series
  description: Return the chart-oriented series payload for the current demo metrics
    selection.
  entry: handlers.main:list_demo_series
  input_schema:
    type: object
    properties:
      metric_id:
        type: string
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      series:
        type: object
    required:
    - ok
    - series
- name: emit_demo_event
  description: Publish one live demo event into the browser event stream.
  entry: handlers.main:emit_demo_event
  input_schema:
    type: object
    properties:
      webspace_id:
        type: string
      action_id:
        type: string
      metric_id:
        type: string
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      event:
        type: object
    required:
    - ok
    - event
updated_at: '2026-05-11T06:55:17+00:00'


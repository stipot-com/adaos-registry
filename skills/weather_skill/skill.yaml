# yaml-language-server: $schema=../../../src/adaos/abi/skill.schema.json
# .adaos\skills\weather_skill\skill.yaml
name: weather_skill
version: '2.0.0'
description: Навык для получения текущей погоды на сегодня
runtime:
  python: '3.11'
dependencies:
  - requests>=2.31
events:
  subscribe:
    - 'nlp.intent.weather.get'
    - 'weather.city_changed'
  publish:
    - 'ui.notify'
default_tool: 'get_weather'
tools:
  - name: 'get_weather'
    description: Возвращает текущие погодные данные по городу
    entry: 'handlers.main:get_weather'
    input_schema:
      type: object
      properties:
        city: { type: string, minLength: 1 }
    output_schema:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        city: { type: string }
        temp: { type: number }
        description: { type: string }
        error: { type: string }
nlu:
  intents:
    - name: weather.show
      utterances:
        - 'какая погода {date?} {place?}'
        - 'погода {date?} {place?}'
        - '{date?} погода {place?}'
      slots:
        date: { type: datetime, required: false }
        place: { type: location, required: false }
      disambiguation:
        inherit: ['date']
        defaults: { place: '@home_city' }
  resolvers:
    location: "handlers.main:resolve_location"

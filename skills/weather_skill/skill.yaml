# yaml-language-server: $schema=../../../src/adaos/abi/skill.schema.json
# .adaos\workspace\skills\weather_skill\skill.yaml
name: weather_skill
version: '2.0.0'
description: Simple weather demo skill that shows current conditions on the desktop and reacts to city changes.
runtime:
  python: '3.11'
dependencies:
  - requests>=2.31
events:
  subscribe:
    - 'nlp.intent.weather.get'
    - 'weather.city_changed'
  publish:
    - 'ui.notify'
data_projections:
  - scope: subnet
    slot: weather.snapshot
    targets:
      - backend: yjs
        path: data/weather
default_tool: 'get_weather'
tools:
  - name: 'get_weather'
    description: Resolve current weather for the requested city and return a basic summary for the UI.
    entry: 'handlers.main:get_weather'
    input_schema:
      type: object
      properties:
        city: { type: string, minLength: 1 }
    output_schema:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        city: { type: string }
        temp: { type: number }
        description: { type: string }
        error: { type: string }
nlu:
  intents:
    - name: weather.show
      utterances:
        - 'какая погода {date?} {place?}'
        - 'погода {date?} {place?}'
        - '{date?} погода {place?}'
      slots:
        date: { type: datetime, required: false }
        place: { type: location, required: false }
      disambiguation:
        inherit: ['date']
        defaults: { place: '@home_city' }
  resolvers:
    location: "handlers.main:resolve_location"

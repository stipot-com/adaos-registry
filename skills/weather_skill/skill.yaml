name: weather_skill
version: 2.6.1
description: Weather skill with Open-Meteo current conditions, forecast, browser location
  support and declarative UI actions.
runtime:
  python: '3.11'
dependencies:
- requests>=2.31
llm_policy:
  autoapply_nlu_teacher: true
events:
  subscribe:
  - nlp.intent.weather.get
  - weather.location.requested
  - weather.city_changed
  publish:
  - ui.notify
  - io.out.chat.append
data_projections:
- scope: subnet
  slot: weather.snapshot
  targets:
  - backend: yjs
    path: data/weather
default_tool: get_weather
tools:
- name: get_weather
  description: Resolve current weather and forecast for a city or browser-provided
    coordinates.
  entry: handlers.main:get_weather
  input_schema:
    type: object
    properties:
      city:
        type: string
        minLength: 1
      latitude:
        type: number
      longitude:
        type: number
      location:
        type: object
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      city:
        type: string
      temp:
        type: number
      description:
        type: string
      current:
        type: object
      hourly_chart:
        type: object
      daily:
        type: array
      error:
        type: string
- name: get_snapshot
  description: Return the current weather widget snapshot for the selected webspace.
  entry: handlers.main:get_snapshot
  input_schema:
    type: object
    properties:
      city:
        type: string
      webspace_id:
        type: string
      target_node_id:
        type: string
  output_schema:
    type: object
    required:
    - ok
    properties:
      ok:
        type: boolean
      current:
        type: object
      weather:
        type: object
nlu:
  intents:
  - name: weather.show
    utterances:
    - какая погода {date?} {place?}
    - погода {date?} {place?}
    - '{date?} погода {place?}'
    slots:
      date:
        type: datetime
        required: false
      place:
        type: location
        required: false
    disambiguation:
      inherit:
      - date
      defaults:
        place: '@home_city'
  resolvers:
    location: handlers.main:resolve_location
  regex_rules:
  - id: rx.1768305525282
    created_at: 1768305525.282357
    intent: desktop.open_weather
    pattern: \bпомерить\s+температуру\s+в\s+(?P<city>[^?.!,;:]+)\b
    enabled: true
    source: teacher
    candidate_id: cand.1768305403150
  - id: rx.655bf395-a748-4bf0-b1b2-5213f62daab8
    created_at: 1768330400.5334976
    intent: desktop.open_weather
    pattern: \bкакая\s+температура\s+в\s+(?P<city>[^?.!,;:]+)\b
    enabled: true
    source: teacher
    candidate_id: cand.1768330399036
updated_at: '2026-05-17T11:50:06+00:00'

